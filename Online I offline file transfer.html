<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P File Transfer</title>
    <!-- JSZip for bundling files on the receiver's end -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- PeerJS for WebRTC connection over internet/local -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --primary: #4F46E5; --bg: #F9FAFB; --panel: #FFFFFF; --text: #1F2937; --border: #E5E7EB; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: var(--panel); max-width: 600px; width: 100%; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 24px; box-sizing: border-box; }
        h1 { margin-top: 0; font-size: 1.5rem; text-align: center; }
        
        .section { border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 20px; }
        .section-title { font-weight: 600; margin-bottom: 12px; font-size: 1.1rem; display: flex; justify-content: space-between; align-items: center; }
        
        button { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        button:disabled { background: #9CA3AF; cursor: not-allowed; }
        
        input[type="text"] { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; outline: none; width: 120px; text-align: center; font-size: 1.1rem; letter-spacing: 2px; }
        
        .flex-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        
        /* Toggle Switch */
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #10B981; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(20px); }
        .network-label { font-size: 0.9rem; color: #4B5563; }

        /* File List */
        .file-list { list-style: none; padding: 0; margin: 12px 0; max-height: 200px; overflow-y: auto; }
        .file-list li { display: flex; justify-content: space-between; align-items: center; padding: 8px; background: #F3F4F6; margin-bottom: 6px; border-radius: 6px; font-size: 0.9rem; }
        .remove-btn { background: #EF4444; padding: 4px 8px; font-size: 0.8rem; }
        
        #status { text-align: center; padding: 10px; border-radius: 6px; background: #EEF2FF; color: var(--primary); font-weight: 500; margin-bottom: 20px; }
        .hidden { display: none !important; }
        
        #download-area { text-align: center; padding: 20px; background: #ECFDF5; border: 1px dashed #10B981; border-radius: 8px; }
        #download-btn { background: #10B981; margin-top: 10px; font-size: 1.1rem; padding: 12px 24px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Secure P2P File Transfer</h1>
    
    <div id="status">Status: Disconnected</div>

    <!-- CONNECTION SECTION -->
    <div class="section" id="connection-section">
        <div class="section-title">
            1. Connect Devices
            <div class="flex-row">
                <span class="network-label" id="network-text">Local WiFi</span>
                <label class="switch">
                    <input type="checkbox" id="network-toggle" checked>
                    <span class="slider"></span>
                </label>
                <span class="network-label">Internet</span>
            </div>
        </div>
        <p style="font-size: 0.85rem; color: #6B7280; margin-top: -5px;">Select network mode before generating OTP.</p>
        
        <div class="flex-row" style="justify-content: space-between; margin-top: 15px;">
            <div class="flex-row">
                <button id="btn-generate">Generate OTP</button>
                <strong id="my-otp" style="font-size: 1.2rem; letter-spacing: 2px;"></strong>
            </div>
            <div style="color: #9CA3AF;">OR</div>
            <div class="flex-row">
                <input type="text" id="target-otp" placeholder="Enter OTP" maxlength="6">
                <button id="btn-connect">Connect</button>
            </div>
        </div>
    </div>

    <!-- FILE STAGING SECTION (Sender) -->
    <div class="section hidden" id="file-section">
        <div class="section-title">2. Select Files to Send</div>
        <input type="file" id="file-input" multiple class="hidden">
        <button onclick="document.getElementById('file-input').click()">+ Add Files</button>
        
        <ul class="file-list" id="staged-files"></ul>
        
        <button id="btn-send" style="width: 100%; margin-top: 10px;" disabled>Send Files</button>
        <div id="transfer-progress" style="text-align: center; font-size: 0.9rem; margin-top: 10px; color: var(--primary);"></div>
    </div>

    <!-- RECEIVER SECTION (Receiver) -->
    <div class="section hidden" id="receive-section">
        <div class="section-title">Received Files</div>
        <div id="download-area">
            <p id="receive-progress">Waiting for files...</p>
            <ul class="file-list" id="received-files-list" style="text-align: left; margin-bottom: 15px;"></ul>
            <button id="download-btn" class="hidden">Bundle & Download as .zip</button>
            <div id="zip-progress" style="margin-top: 10px; font-size: 0.9rem; color: #10B981;"></div>
        </div>
    </div>
</div>

<script>
    const APP_PREFIX = "ft-app-otp-"; 
    let peer = null;
    let conn = null;
    
    // Sender state
    let stagedFilesArray = [];
    
    // Receiver state
    let expectedFiles = 0;
    let receivedFiles = [];

    // UI Elements
    const statusEl = document.getElementById('status');
    const networkToggle = document.getElementById('network-toggle');
    const myOtpEl = document.getElementById('my-otp');
    const fileListEl = document.getElementById('staged-files');
    const btnSend = document.getElementById('btn-send');
    const transferProgress = document.getElementById('transfer-progress');
    const receiveProgress = document.getElementById('receive-progress');
    const receivedFilesListEl = document.getElementById('received-files-list');
    const downloadBtn = document.getElementById('download-btn');
    const zipProgress = document.getElementById('zip-progress');

    // Toggle Network Logic
    networkToggle.addEventListener('change', (e) => {
        document.getElementById('network-text').style.fontWeight = e.target.checked ? "normal" : "bold";
    });

    function updateStatus(msg) {
        statusEl.innerText = `Status: ${msg}`;
    }

    // Initialize PeerJS Connection
    function initPeer(otp) {
        const useInternet = networkToggle.checked;
        const config = useInternet 
            ? { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' }] }
            : { iceServers: [] }; 

        peer = new Peer(`${APP_PREFIX}${otp}`, { config: config });

        peer.on('open', (id) => {
            updateStatus(`Waiting for peer to connect (OTP: ${otp})`);
        });

        peer.on('connection', (connection) => {
            conn = connection;
            setupConnection();
        });

        peer.on('error', (err) => {
            updateStatus(`Error: ${err.type}`);
            console.error(err);
        });
    }

    // Set up data channel listeners
    function setupConnection() {
        conn.on('open', () => {
            updateStatus('Connected!');
            document.getElementById('connection-section').classList.add('hidden');
            // Once connected, show the file sender section
            document.getElementById('file-section').classList.remove('hidden');
        });

        conn.on('data', (data) => {
            // Unhide receiver section when first bit of data arrives
            document.getElementById('receive-section').classList.remove('hidden');
            document.getElementById('file-section').classList.add('hidden'); // Hide sender UI for the receiver

            if (data.type === 'batch-start') {
                expectedFiles = data.total;
                receivedFiles = [];
                receivedFilesListEl.innerHTML = '';
                receiveProgress.innerText = `Receiving 0 of ${expectedFiles} files...`;
                downloadBtn.classList.add('hidden');
            } 
            else if (data.type === 'file') {
                // Store received file metadata and Blob
                receivedFiles.push({ name: data.name, blob: new Blob([data.file]) });
                
                // Update receiver UI list
                const li = document.createElement('li');
                li.innerText = data.name;
                receivedFilesListEl.appendChild(li);
                
                receiveProgress.innerText = `Receiving ${receivedFiles.length} of ${expectedFiles} files...`;

                // If all files are received, enable the Zip button
                if (receivedFiles.length === expectedFiles) {
                    receiveProgress.innerText = "All files received successfully!";
                    downloadBtn.classList.remove('hidden');
                }
            }
        });
    }

    // GENERATE OTP
    document.getElementById('btn-generate').addEventListener('click', () => {
        const otp = Math.floor(100000 + Math.random() * 900000).toString();
        myOtpEl.innerText = otp;
        initPeer(otp);
        document.getElementById('btn-generate').disabled = true;
        networkToggle.disabled = true;
    });

    // CONNECT TO OTP
    document.getElementById('btn-connect').addEventListener('click', () => {
        const targetOtp = document.getElementById('target-otp').value;
        if (targetOtp.length !== 6) { alert('Enter a valid 6-digit OTP'); return; }
        
        const tempId = Math.floor(100000 + Math.random() * 900000).toString();
        initPeer(tempId); 

        peer.on('open', () => {
            updateStatus(`Connecting to ${targetOtp}...`);
            conn = peer.connect(`${APP_PREFIX}${targetOtp}`, { reliable: true });
            setupConnection();
        });
    });

    // FILE HANDLING (Staging on Sender side)
    document.getElementById('file-input').addEventListener('change', (e) => {
        const files = Array.from(e.target.files);
        files.forEach(file => {
            if (!stagedFilesArray.some(f => f.name === file.name && f.size === file.size)) {
                stagedFilesArray.push(file);
            }
        });
        renderFileList();
        e.target.value = '';
    });

    function renderFileList() {
        fileListEl.innerHTML = '';
        stagedFilesArray.forEach((file, index) => {
            const li = document.createElement('li');
            li.innerHTML = `
                <span>${file.name}</span>
                <button class="remove-btn" onclick="removeFile(${index})">Remove</button>
            `;
            fileListEl.appendChild(li);
        });
        btnSend.disabled = stagedFilesArray.length === 0;
    }

    window.removeFile = function(index) {
        stagedFilesArray.splice(index, 1);
        renderFileList();
    };

    // SENDING FILES SEPARATELY
    btnSend.addEventListener('click', () => {
        if (stagedFilesArray.length === 0 || !conn) return;
        
        btnSend.disabled = true;
        transferProgress.innerText = "Sending files...";
        
        // 1. Send metadata signaling how many files to expect
        conn.send({ type: 'batch-start', total: stagedFilesArray.length });

        // 2. Send each file individually
        stagedFilesArray.forEach((file, index) => {
            conn.send({
                type: 'file',
                name: file.name,
                file: file // PeerJS handles File/Blob types automatically
            });
        });

        transferProgress.innerText = "All files dispatched!";
        setTimeout(() => { 
            transferProgress.innerText = ""; 
            btnSend.disabled = false; 
            stagedFilesArray = []; 
            renderFileList(); 
        }, 3000);
    });

    // BUNDLE AND DOWNLOAD ON RECEIVER SIDE
    downloadBtn.addEventListener('click', async () => {
        if (receivedFiles.length === 0) return;
        
        downloadBtn.disabled = true;
        zipProgress.innerText = "Zipping files, please wait...";

        try {
            const zip = new JSZip();
            
            // Add all received files to the zip instance
            receivedFiles.forEach(f => {
                zip.file(f.name, f.blob);
            });
            
            // Generate the zip blob
            const zipBlob = await zip.generateAsync({ type: "blob" });
            
            // Trigger automatic download
            const url = URL.createObjectURL(zipBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Received_Files_${Math.floor(Date.now() / 1000)}.zip`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            zipProgress.innerText = "Download triggered!";
        } catch (error) {
            console.error(error);
            zipProgress.innerText = "Error creating zip file.";
        } finally {
            downloadBtn.disabled = false;
            setTimeout(() => zipProgress.innerText = "", 3000);
        }
    });
</script>

</body>
</html>
